    <style>
        /* =========================
   CONTACT PAGE BASE
========================= */

        .input-error {
            border: 1px solid rgba(255, 70, 70, 0.9) !important;
            box-shadow: 0 0 0 4px rgba(255, 70, 70, 0.14) !important;
        }

        .placeholder-error::placeholder {
            color: rgba(255, 70, 70, 0.95) !important;
            font-weight: 700;
        }

        .shake {
            animation: shakeAnim 0.35s ease;
        }

        @keyframes shakeAnim {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            50% {
                transform: translateX(6px);
            }

            75% {
                transform: translateX(-6px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* =========================
   FORM TEXT
========================= */

        .form-note {
            margin-top: 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--pera-color);
            line-height: 1.5;
        }

        .form-note.success {
            color: rgba(34, 211, 238, 0.95);
        }

        .form-note.error {
            color: rgba(255, 70, 70, 0.95);
        }

        /* =========================
   LAYOUT
========================= */

        .contact-container {
            display: flex;
            gap: 40px;
            width: 100%;
            justify-content: center;
            align-items: stretch;
        }

        .contact-details,
        .contact-form {
            background-color: var(--bg-card);
            min-height: 500px;
            width: 40%;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .contact-details h2,
        .contact-form h2 {
            margin-bottom: 20px;
        }

        .contact-details-pera-group {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-details-pera-group p {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--link-color);
        }

        .active-link {
            color: var(--link-color);
            text-decoration: none;
        }

        /* =========================
   FORM
========================= */

        .contact-form-input-group {
            margin-top: 30px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.04);
            color: var(--pera-color);
            font-family: inherit;
            outline: none;
            transition: 0.25s ease;
        }

        input:focus,
        textarea:focus {
            border-color: var(--border-active);
        }

        textarea {
            resize: none;
            min-height: 160px;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.21);
        }

        .contact-form .btn {
            width: 100%;
        }

        /* =========================
   TABLET
========================= */

        @media (max-width: 1111px) {
            .contact-container {
                flex-direction: column;
                align-items: center;
            }

            .contact-details,
            .contact-form {
                width: 80%;
                min-height: auto;
            }
        }

        @media (max-width: 768px) {
            .contact-container {
                gap: 24px;
            }

            .contact-details,
            .contact-form {
                width: 100%;
                padding: 18px;
            }

            .contact-details h2,
            .contact-form h2 {
                margin-bottom: 16px;
                font-size: 28px;
            }

            .contact-details-pera-group {
                margin-top: 24px;
                gap: 16px;
            }

            .contact-form-input-group {
                margin-top: 24px;
            }

            input,
            textarea {
                padding: 11px 13px;
                border-radius: 10px;
            }

            textarea {
                min-height: 140px;
            }
        }

        /* =========================
   MOBILE
========================= */

        @media (max-width: 480px) {
            .contact-container {
                gap: 18px;
            }

            .contact-details,
            .contact-form {
                padding: 16px;
                border-radius: 10px;
            }

            .contact-details h2,
            .contact-form h2 {
                font-size: 24px;
            }

            .contact-details-pera-group p {
                font-size: 14px;
                line-height: 1.5;
                word-break: break-word;
            }

            .form-note {
                font-size: 11px;
            }

            textarea {
                min-height: 130px;
            }
        }
